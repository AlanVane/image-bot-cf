name: CI

# 门禁：typecheck + 测试 + 依赖许可证 allowlist 扫描（LICENSES.md §4）
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: License allowlist scan
        run: node scripts/license-scan.mjs
